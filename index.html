<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>UPTIME DASHBOARD</title>

<link rel="manifest" href="manifest.json">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0e1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    transition: transform 0.2s ease-out;
  }
  header {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid #21262d;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.5px;
  }

  #pull-indicator {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8b949e;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
  }
  #pull-indicator.visible { opacity: 1; }
  #pull-indicator.ready { color: #58a6ff; }

  #pull-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 8px;
    border: 2px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #pull-indicator.loading #pull-spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    text-align: center;
    color: #8b949e;
    font-size: 14px;
    padding: 40px 0;
  }
  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card .name {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .card .bar {
    font-size: 20px;
    line-height: 1.2;
    margin-bottom: 8px;
    word-break: break-all;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .card .time {
    font-size: 15px;
    color: #8b949e;
  }
  .card .time b { color: #e6edf3; font-weight: 600; }

  .footer {
    text-align: center;
    color: #484f58;
    font-size: 12px;
    margin-top: 24px;
  }
  .error { color: #f85149; }
</style>
</head>
<body>

<div id="pull-indicator">
  <span id="pull-spinner"></span>
  <span id="pull-text">Потяните для обновления</span>
</div>

<div class="container" id="container">
  <header>
    <h1>📶 UPTIME DASHBOARD</h1>
  </header>
  <div id="content">
    <div class="status">Загрузка…</div>
  </div>
  <div class="footer" id="footer"></div>
</div>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const CHANNELS = [
  { name: 'MALYN',     ntfyUrl: 'https://ntfy.sh/MALIN',     routerStartTime: '2026-09-10T08:00:00Z' },
  { name: 'CHAYKA',    ntfyUrl: 'https://ntfy.sh/CHAYKA',    routerStartTime: '2026-09-09T13:00:00Z' },
  { name: 'TERESVA',   ntfyUrl: 'https://ntfy.sh/TERESVA',   routerStartTime: '2026-08-22T08:00:00Z' },
  { name: 'MUKACHEVO', ntfyUrl: 'https://ntfy.sh/MUKACHEVO', routerStartTime: '2026-09-11T21:00:00Z' }
];

const MAX_DAYS_FOR_CHART = 30;
const FETCH_TIMEOUT_MS = 8000;
const PULL_THRESHOLD = 80;
const PULL_MAX = 120;
const VISIBILITY_REFRESH_GAP_MS = 10000; // не чаще раза в 10 сек при возврате

// ============================================================
// LOCALSTORAGE
// ============================================================
const DB = {
  get(key) {
    try { return localStorage.getItem('dashboard_' + key); } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem('dashboard_' + key, String(value)); } catch (e) {}
  }
};

// ============================================================
// NTFY
// ============================================================
async function tryLoad(ntfyUrl, sinceParam) {
  try {
    const url = ntfyUrl + '/json?poll=1&since=' + sinceParam;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    const text = await response.text();
    const lines = text.split('\n');
    const messages = [];
    for (const line of lines) {
      if (!line.trim()) continue;
      try {
        const data = JSON.parse(line);
        if (data.event === 'message') messages.push(data);
      } catch (e) {}
    }
    return messages;
  } catch (error) {
    return [];
  }
}

async function loadRecentMessages(ntfyUrl) {
  let messages = await tryLoad(ntfyUrl, '1d');
  if (messages.length > 0) return messages;
  messages = await tryLoad(ntfyUrl, '7d');
  return messages;
}

// ============================================================
// РАСЧЁТЫ
// ============================================================
function getDurationSeconds(startTimestamp) {
  if (!startTimestamp) return 0;
  const nowSeconds = Math.floor(Date.now() / 1000);
  const diff = nowSeconds - startTimestamp;
  return diff > 0 ? diff : 0;
}

function formatDuration(seconds) {
  if (!seconds || seconds < 0) return '0д 0ч 0м';
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return days + 'д ' + hours + 'ч ' + minutes + 'м';
}

function getRouterStartTimestamp(routerStartTime) {
  try {
    const dt = new Date(routerStartTime);
    return Math.floor(dt.getTime() / 1000);
  } catch (error) { return null; }
}

function getBarColor(seconds) {
  const days = seconds / 86400;
  if (days < 10)  return '🟥';
  if (days < 20)  return '🟨';
  return '🟩';
}

function buildColoredBar(seconds, maxSeconds, barLength) {
  barLength = barLength || 10;
  if (maxSeconds <= 0) return '⬜'.repeat(barLength);
  if (seconds > maxSeconds) {
    return '🟩'.repeat(barLength) + ' > ' + MAX_DAYS_FOR_CHART + 'д';
  }
  const ratio = Math.min(seconds / maxSeconds, 1);
  const filled = Math.max(1, Math.round(ratio * barLength));
  const empty = barLength - filled;
  const color = getBarColor(seconds);
  return color.repeat(filled) + '⬜'.repeat(empty);
}

// ============================================================
// ОБРАБОТКА КАНАЛА
// ============================================================
async function processChannel(channel) {
  const messages = await loadRecentMessages(channel.ntfyUrl);
  let lastTimestamp = null;
  if (messages && messages.length > 0) {
    let maxTime = 0;
    for (const msg of messages) {
      let ts = parseInt(msg.time);
      if (ts > 10000000000) ts = Math.floor(ts / 1000);
      if (ts > maxTime) maxTime = ts;
    }
    if (maxTime > 0) lastTimestamp = maxTime;
  }
  const dbKey = 'router_start_' + channel.name;
  let startTimestamp;
  if (lastTimestamp) {
    DB.set(dbKey, String(lastTimestamp));
    startTimestamp = lastTimestamp;
  } else {
    const saved = DB.get(dbKey);
    if (saved && saved !== '' && saved !== 'null' && saved !== 'undefined') {
      startTimestamp = parseInt(saved);
    } else {
      startTimestamp = getRouterStartTimestamp(channel.routerStartTime);
    }
  }
  const seconds = getDurationSeconds(startTimestamp);
  return {
    name: channel.name,
    seconds: seconds,
    duration: formatDuration(seconds)
  };
}

// ============================================================
// РЕНДЕР
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function renderWithPlaceholders() {
  const maxSeconds = MAX_DAYS_FOR_CHART * 86400;
  let html = '';
  for (const channel of CHANNELS) {
    const r = cache[channel.name];
    if (r) {
      const bar = buildColoredBar(r.seconds, maxSeconds, 10);
      html +=
        '<div class="card">' +
          '<div class="name">' + escapeHtml(r.name) + '</div>' +
          '<div class="bar">' + bar + '</div>' +
          '<div class="time">⏱ <b>' + r.duration + '</b></div>' +
        '</div>';
    } else {
      html +=
        '<div class="card">' +
          '<div class="name">' + escapeHtml(channel.name) + '</div>' +
          '<div class="bar" style="opacity:0.3">⬜⬜⬜⬜⬜⬜⬜⬜⬜⬜</div>' +
          '<div class="time" style="opacity:0.5">⏱ загрузка…</div>' +
        '</div>';
    }
  }
  document.getElementById('content').innerHTML = html;
}

// ============================================================
// ГЛАВНАЯ ЛОГИКА
// ============================================================
let loading = false;
let cache = {};
let lastVisibilityRefresh = 0;

try {
  const saved = localStorage.getItem('dashboard_cache');
  if (saved) cache = JSON.parse(saved);
} catch (e) {}

async function loadAll() {
  if (loading) return;
  loading = true;

  showPullIndicator('loading');
  renderWithPlaceholders();

  const promises = CHANNELS.map(async (channel) => {
    try {
      const result = await processChannel(channel);
      cache[result.name] = result;
      return result;
    } catch (e) {
      return null;
    }
  });

  await Promise.all(promises);

  // Перерисовываем один раз после всех ответов
  renderWithPlaceholders();

  try {
    localStorage.setItem('dashboard_cache', JSON.stringify(cache));
  } catch (e) {}

  document.getElementById('footer').textContent =
    'Обновлено в ' + new Date().toLocaleTimeString('ru-RU') +
    ' • потяните вниз для обновления';

  loading = false;
  hidePullIndicator();
}

// ============================================================
// PULL-TO-REFRESH
// ============================================================
const container = document.getElementById('container');
const indicator = document.getElementById('pull-indicator');
const pullText = document.getElementById('pull-text');

let touchStartY = 0;
let pulling = false;
let currentPull = 0;

function showPullIndicator(state) {
  indicator.classList.add('visible');
  if (state === 'loading') {
    indicator.classList.add('loading');
    pullText.textContent = 'Обновление…';
  } else if (state === 'ready') {
    indicator.classList.remove('loading');
    indicator.classList.add('ready');
    pullText.textContent = 'Отпустите для обновления';
  } else {
    indicator.classList.remove('loading', 'ready');
    pullText.textContent = 'Потяните для обновления';
  }
}

function hidePullIndicator() {
  indicator.classList.remove('visible', 'loading', 'ready');
  container.style.transform = '';
  currentPull = 0;
}

document.addEventListener('touchstart', (e) => {
  if (window.scrollY === 0 && !loading) {
    touchStartY = e.touches[0].clientY;
    pulling = true;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (!pulling || loading) return;
  const deltaY = e.touches[0].clientY - touchStartY;
  if (deltaY > 0 && window.scrollY === 0) {
    currentPull = Math.min(deltaY * 0.5, PULL_MAX);
    container.style.transform = 'translateY(' + currentPull + 'px)';
    if (currentPull >= PULL_THRESHOLD) {
      showPullIndicator('ready');
    } else {
      showPullIndicator('pull');
    }
  } else {
    if (currentPull > 0) hidePullIndicator();
    pulling = false;
  }
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!pulling) return;
  pulling = false;
  if (currentPull >= PULL_THRESHOLD) {
    container.style.transform = 'translateY(0)';
    currentPull = 0;
    loadAll();
  } else {
    hidePullIndicator();
  }
}, { passive: true });

// ============================================================
// СТАРТ
// ============================================================
loadAll();

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    const now = Date.now();
    if (now - lastVisibilityRefresh > VISIBILITY_REFRESH_GAP_MS) {
      lastVisibilityRefresh = now;
      loadAll();
    }
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
